name: Daily On-Call Notification
on:
  workflow_dispatch:  # ← add this line
  schedule:
    - cron: '0 6 * * *'
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pip install requests && python oncall_notify.py
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
