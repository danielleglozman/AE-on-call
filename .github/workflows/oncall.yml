name: Daily On-Call Notification
on:
  schedule:
    - cron: '0 6 * * *'  # 6:00 UTC = 9:00 AM Israel time (IDT, UTC+3)
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pip install requests && python oncall_notify.py
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
