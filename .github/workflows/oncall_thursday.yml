name: Thursday On-Call Reminder
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 4'  # Thursday 11 AM Israel time (IDT/UTC+3)
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: pip install requests && python oncall_notify.py
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_AE }}
          WEEK_OFFSET: 1
